name: nightly
# Every commit of main: DN for all the targets (Linux x86_64, ARM64, i386, Windows 64 and 32 bit, DOS with the code page and with UTF-8 inside)
# goes to the release "nightly" (the old one is replaced). The builds are the same as in the other workflows (tools/build.sh); the packing is
# tools/pack-nightly.sh. A build that does not pass the tests of those workflows is still published here: it is a snapshot, not a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3 zip
      - run: tools/build.sh linux64 out/dn
      - run: tools/pack-nightly.sh out/dn linux64 tar pack
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-linux64
          path: pack/*

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3 zip
      - run: tools/build.sh linux64 out/dn
      - run: tools/pack-nightly.sh out/dn linux-arm64 tar pack
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-linux-arm64
          path: pack/*

  linux32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc make git binutils python3 zip
      - name: Cross compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-i386-linux
          key: fpc-i386-linux-${{ hashFiles('tools/build-fpc-i386-linux.sh') }}
      - name: Build the cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-i386-linux.sh ~/fpc-i386-linux
      - run: DN_LINUX=~/fpc-i386-linux tools/build.sh linux out/dn
      - run: tools/pack-nightly.sh out/dn linux32 tar pack
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-linux32
          path: pack/*

  windows:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [win64, win32]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc make git binutils binutils-mingw-w64-x86-64 binutils-mingw-w64-i686 python3 zip
      - name: Cross compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-${{ matrix.target }}
          key: fpc-${{ matrix.target }}-${{ hashFiles('tools/build-fpc-windows.sh') }}
      - name: Build the cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-windows.sh ~/fpc-${{ matrix.target }} ${{ matrix.target }}
      - name: Build DN
        run: |
          if [ "${{ matrix.target }}" = win64 ]; then export DN_WIN=~/fpc-win64; else export DN_WIN32=~/fpc-win32; fi
          tools/build.sh ${{ matrix.target }} out/dn
      - run: tools/pack-nightly.sh out/dn ${{ matrix.target }} zip pack
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.target }}
          path: pack/*

  dos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc make bzip2 git curl dosbox-x unzip python3 zip
      - name: Cross toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fpc-go32v2
          key: fpc-go32v2-${{ hashFiles('tools/build-fpc-go32v2.sh') }}
      - name: Build cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-go32v2.sh "${{ runner.temp }}/fpc-go32v2"
      - name: Build DN for DOS (the code page inside) and DOS with UTF-8 inside
        env:
          DN_PREFIX: ${{ runner.temp }}/fpc-go32v2
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          tools/build.sh dos out/dos
          DN_UTF8=1 tools/build.sh dos out/dos-utf8
      - run: |
          tools/pack-nightly.sh out/dos dos zip pack
          tools/pack-nightly.sh out/dos-utf8 dos-utf8 zip pack
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-dos
          path: pack/*

  publish:
    needs: [linux64, linux-arm64, linux32, windows, dos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: assets
          merge-multiple: true
      - name: Replace the release "nightly"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ls -l assets
          [ -n "$(ls assets)" ] || { echo "nothing was built" >&2; exit 1; }
          sha=$(git rev-parse --short HEAD)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly assets/* --prerelease --target "$GITHUB_SHA" \
            --title "nightly $sha" \
            --notes "The builds of the commit $GITHUB_SHA (every commit of main replaces this release). Snapshots: they can be unfinished. The targets that failed to build are not here."
