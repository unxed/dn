name: toolchain
# Cross toolchain FPC -> DOS (go32v2): FPC 3.2.2 built from the official sources
# with DJGPP binutils, cached by the hash of the build script. Then hello.exe is
# run in DOSBox-X without a display.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build-fpc-go32v2.sh
      - tests/dos/**
      - .github/workflows/toolchain.yml

jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        # only the compiler and the RTL: 'fpc' drags in GTK and takes ~13 minutes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl make bzip2 git curl dosbox-x unzip
      - name: Cross toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-go32v2
          key: fpc-go32v2-${{ hashFiles('tools/build-fpc-go32v2.sh') }}
      - name: Build cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-go32v2.sh ~/fpc-go32v2
      - name: Compile hello for go32v2
        run: |
          mkdir -p out
          ~/fpc-go32v2/bin/fpc-go32v2 -FEout tests/dos/hello.pas
          file out/hello.exe
      - name: DPMI host (CWSDPMI, not committed)
        run: |
          curl -fsSL --retry 4 -o csdpmi.zip https://www.delorie.com/pub/djgpp/current/v2misc/csdpmi7b.zip
          unzip -j -o csdpmi.zip 'bin/CWSDPMI.EXE' -d out
          ls -l out
      - name: Run in DOSBox-X (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd out
          timeout 120 dosbox-x -silent -nogui -noconsole -defaultconf \
            -c "mount c $PWD" -c "c:" -c "hello.exe > out.txt" -c "exit" || true
          echo "--- out.txt:"; cat -v OUT.TXT
          grep -q 'hello from go32v2' OUT.TXT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-go32v2
          path: |
            out/hello.exe
            out/OUT.TXT

  cwsdpmi-license:
    # separate job so that the log stays short: prints the distribution terms
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -fsSL --retry 4 -o csdpmi.zip https://www.delorie.com/pub/djgpp/current/v2misc/csdpmi7b.zip
          unzip -p csdpmi.zip bin/cwsdpmi.doc | grep -n -i -B1 -A6 -E 'distribut|licen|copyright|redistrib|source' | head -80
