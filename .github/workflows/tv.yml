name: tv
# Tests of the tv/ units: natively on Linux and under DOS (go32v2 in DOSBox-X).
# Every tv/tests/test_*.pas prints "ALL OK" at the end when all checks pass.
on:
  workflow_dispatch:
  push:
    paths:
      - tv/**
      - tools/dos-run.sh
      - tools/build-fpc-go32v2.sh
      - .github/workflows/tv.yml

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl
      - name: Build and run the tests
        run: |
          mkdir -p out
          cd tv/tests
          for t in test_*.pas; do
            fpc -Fu../src -FE../../out "$t" | grep -E 'Error|Fatal' && exit 1
            echo "=== ${t%.pas}"
            ../../out/${t%.pas} | tee ../../out/${t%.pas}.txt
            grep -q '^ALL OK' ../../out/${t%.pas}.txt
          done

  dos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl make bzip2 git curl dosbox-x unzip
      - name: Cross toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-go32v2
          key: fpc-go32v2-${{ hashFiles('tools/build-fpc-go32v2.sh') }}
      - name: Build cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-go32v2.sh ~/fpc-go32v2
      - name: Build and run the tests under DOS
        run: |
          mkdir -p out
          cd tv/tests
          for t in test_*.pas; do
            ~/fpc-go32v2/bin/fpc-go32v2 -Fu../src -FE../../out "$t" | grep -E 'Error|Fatal' && exit 1
            echo "=== ${t%.pas}"
            ../../tools/dos-run.sh ../../out "${t%.pas}.exe" | tee ../../out/${t%.pas}.txt
            grep -q '^ALL OK' ../../out/${t%.pas}.txt
          done
