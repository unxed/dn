name: tv
# Tests of the tv/ units: natively on Linux and under DOS (go32v2 in DOSBox-X).
# Every tv/tests/t_*.pas prints "ALL OK" at the end when all checks pass.
on:
  workflow_dispatch:
  push:
    paths:
      - tv          # the pointer of the submodule (a change of it is a change of the file `tv`, not of `tv/**`)
      - tv/**
      - tools/dos-run.sh
      - tools/dos-par.sh
      - tools/render-dump.py
      - tools/pty_screen.py
      - tools/ci-par.sh
      - tools/build-fpc-go32v2.sh
      - .github/workflows/tv.yml

jobs:
  native:
    # x86_64 and ARM64 (the runner of the architecture builds with the compiler of the system)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl
      - name: Build and run the tests (tools/tv-test.sh)
        run: tools/tv-test.sh

  unix:
    # the terminal backend (TvUnix) in a pty: tools/pty_screen.py is the terminal that checks the screen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl python3
      - name: Build the programs
        run: |
          mkdir -p out
          for p in tv/demo/tvdemo.pas tv/demo/tvterm.pas tv/tests/pty/rundemo.pas tv/tests/pty/clipdemo.pas; do
            fpc -Futv/src -FUout -FEout "$p" | grep -E 'Error|Fatal' && exit 1
          done
          true
      - name: tvdemo, the terminal view (tvterm), a program on the whole screen (VtRunScreen) and the clipboard (OSC 52) in a pty, side by side
        env:
          CMDS: |
            python3 tv/tests/pty/test_tvdemo.py out/tvdemo
            python3 tv/tests/pty/test_win32input.py out/tvdemo
            python3 tv/tests/pty/test_tvterm.py out/tvterm
            python3 tv/tests/pty/test_vtrun.py out/rundemo
            python3 tv/tests/pty/test_clip.py out/clipdemo
        run: tools/ci-par.sh

  policy:
    # the text of tv/: UTF-8, English, the glyphs by name (tv/tools/text-policy.py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: python3 tv/tools/text-policy.py

  dos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl make bzip2 git curl dosbox-x unzip python3-pil fonts-dejavu-core
      - name: Cross toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-go32v2
          key: fpc-go32v2-${{ hashFiles('tools/build-fpc-go32v2.sh') }}
      - name: Build cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-go32v2.sh ~/fpc-go32v2
      - name: Build and run the tests under DOS
        run: |
          mkdir -p out
          cd tv/tests
          failed=""
          exes=""
          for t in t_*.pas; do
            case "${t%.pas}" in t_tvhc) continue ;; esac     # runs the help compiler with the fpc of the system: not under DOS
            [ ${#t} -gt 12 ] && { echo "=== ${t%.pas}: skipped (the name is not 8.3: a native test)"; continue; }
            ~/fpc-go32v2/bin/fpc-go32v2 -Fu../src -Fu. -FE../../out "$t" | grep -E 'Error|Fatal' && exit 1
            exes="$exes ${t%.pas}.exe"
          done
          # the programs wait for the emulator, not for the CPU: all of them side by side, each in a directory of its own
          ../../tools/dos-par.sh ../../out $exes
          for e in $exes; do
            echo "=== ${e%.exe}"
            cat ../../out/${e%.exe}.txt
            grep -q '^ALL OK' ../../out/${e%.exe}.txt || failed="$failed ${e%.exe}"
          done
          # a compact report of what failed (the full output is above)
          for t in $failed; do
            echo "--- $t"; grep -E '^FAIL|heap since|checks FAILED|Runtime error|Exception|Bad command' ../../out/$t.txt | head -20
          done
          # all the tests are run, so that one round of CI shows all the failures
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
      - name: Tests of the DOS backend (video memory, keyboard, mouse, clock)
        run: |
          mkdir -p out2
          cd tv/dostests
          ~/fpc-go32v2/bin/fpc-go32v2 -Fu../src -Fu. -FE../../out2 t_dosbk.pas | grep -E 'Error|Fatal' && exit 1
          ../../tools/dos-run.sh ../../out2 t_dosbk.exe | tee ../../out2/t_dosbk.txt
          grep -q '^ALL OK' ../../out2/t_dosbk.txt
      - name: Demo under DOS (the screen is dumped from video memory)
        run: |
          cd tv/demo
          ~/fpc-go32v2/bin/fpc-go32v2 -Fu../src -Fu. -FE../../out2 tvdemo.pas | grep -E 'Error|Fatal' && exit 1
          ../../tools/dos-run.sh ../../out2 "tvdemo.exe /auto"
          dump=$(ls ../../out2 | grep -i '^scr\.dat$' | tail -1)
          test -n "$dump"
          python3 ../../tools/render-dump.py "../../out2/$dump" ../../out2/screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dos-demo
          path: |
            out2/screen.png
            out2/*.dat
            out2/*.DAT
            out2/t_dosbk.txt
