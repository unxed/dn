name: dn-windows
# DN for Windows (win64, win32): cross-compiled on Linux by tools/build.sh (the cross compiler is built from the FPC sources with
# mingw-w64 binutils and cached), then run on a real Windows console (ConPTY) by tools/dn-win-smoke.py.
on:
  workflow_dispatch:
  push:
    paths:
      - dn/**
      - tv/**
      - tools/build.sh
      - tools/dn-env.sh
      - tools/dn-win-smoke.py
      - tools/pty_screen.py
      - tools/build-fpc-windows.sh
      - tools/gen-shim.py
      - .github/workflows/dn-windows.yml
  pull_request:

concurrency:
  group: dn-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [win64, win32]
        utf8: ['1', '0']        # 1: UTF-8 inside DN (the default; the names through the wide API of Windows), 0: the code page
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc make git binutils binutils-mingw-w64-x86-64 binutils-mingw-w64-i686 python3
      - name: Cross compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-${{ matrix.target }}
          key: fpc-${{ matrix.target }}-${{ hashFiles('tools/build-fpc-windows.sh') }}
      - name: Build the cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-windows.sh ~/fpc-${{ matrix.target }} ${{ matrix.target }}
      - name: Build DN (one command)
        run: |
          if [ "${{ matrix.target }}" = win64 ]; then export DN_WIN=~/fpc-win64; else export DN_WIN32=~/fpc-win32; fi
          DN_UTF8=${{ matrix.utf8 }} tools/build.sh ${{ matrix.target }} out/dn
      - uses: actions/upload-artifact@v4
        with:
          name: dn-${{ matrix.target }}-u${{ matrix.utf8 }}
          path: out/dn

  smoke:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64, win32]
        utf8: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: dn-${{ matrix.target }}-u${{ matrix.utf8 }}
          path: out/dn
      - run: python -m pip install pywinpty
      - name: DN on a Windows console (ConPTY)
        env:
          DN_SMOKE_UTF8: ${{ matrix.utf8 }}
        run: python tools/dn-win-smoke.py out/dn
