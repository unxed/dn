name: dn
# The tree of DOS Navigator (dn/src) is in git. This workflow checks: (1) the audit gate against the Borland reference over the
# whole tree (every PR), (2) that bootstrap/ still reproduces the tree of the baseline commit (the record of where the first
# commit came from), (3) the unit tests of our own units.
on:
  workflow_dispatch:
  push:
    paths:
      - dn/**
      - bootstrap/**
      - tools/dn-test.sh
      - tools/class-gate.py
      - tools/class-gate.sh
      - tools/tests/test_class_gate.py
      - tools/gen-shim.py
      - tools/ci-par.sh
      - audit/**
      - .github/workflows/dn.yml
  pull_request:

concurrency:
  group: dn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unrar unzip curl python3
      - name: Fetch the Borland reference
        run: audit/fetch_reference.sh
      - name: Audit of dn/src, dn/archives, dn/compat, side by side (only names and numbers are printed)
        run: |
          pids=
          for d in src archives compat; do python3 audit/xclone.py --min 3 --ref audit/ref/list.txt dn/$d > audit-$d.txt & pids="$pids $!"; done
          for p in $pids; do wait $p; done
          cat audit-src.txt audit-archives.txt audit-compat.txt > audit.txt
          head -60 audit.txt
      - name: The gate (raw <= 10 % and maxrun < 48 for every file; the accepted exceptions are in audit/accepted.txt and are printed)
        run: |
          tail -1 audit.txt
          python3 audit/gate.py audit.txt

  gates:
    # A job of its own, beside the audit (which waits for the download of the reference): the checks run side by side.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: dn/PROVENANCE.md up to date, the class-gate regressions, the Pascal class gate (all tracked sources, including bootstrap; old construction idioms are blocking)
        env:
          CMDS: |
            python3 bootstrap/tools/dn-manifest.py --check
            python3 -B -m unittest discover -s tools/tests -p 'test_class_gate.py'
            CLASS_GATE_STRICT=1 tools/class-gate.sh
        run: tools/ci-par.sh

  bootstrap:
    # The record of the path: the public archive -> bootstrap/run.sh -> the tree of the baseline commit (bootstrap/BASELINE).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unrar unzip curl python3 patch
      - name: Run bootstrap
        run: bootstrap/run.sh out/bootstrap
      - name: Is the result the tree of the baseline commit?
        run: |
          tag=$(grep -v '^#' bootstrap/BASELINE | tail -1)
          echo "baseline commit: $tag"
          mkdir -p out/ref && git archive "$tag" dn/src dn/data | tar -x -C out/ref
          rm -f out/ref/dn/src/read.me   # the old Virtual Pascal notes: removed from the tree after the baseline (docs/TEXT-POLICY.md), not made by the bootstrap
          diff -r out/bootstrap/src out/ref/dn/src && diff -r out/bootstrap/data out/ref/dn/data && echo "the same as $tag"

  units:
    # Tests of our own units in dn/tests, natively.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: Build and run the tests
        run: tools/dn-test.sh
