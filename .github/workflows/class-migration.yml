name: class-migration
on:
  workflow_dispatch:
  push:
    branches: ['classes/**']
    paths:
      - dn/**
      - tv
      - tools/gen-shim.py
      - tools/class_names.py
      - tools/source_encoding.py
      - tools/ci-par.sh
      - tools/tests/**
      - .github/workflows/class-migration.yml
  pull_request:
    paths:
      - dn/**
      - tv
      - tools/gen-shim.py
      - tools/class_names.py
      - tools/source_encoding.py
      - tools/ci-par.sh
      - tools/tests/**
      - .github/workflows/class-migration.yml

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl python3
      - name: tv3 prerequisite gate, Pascal class-name conversion checks, class release and profile persistence, side by side
        shell: bash
        run: |
          w="$RUNNER_TEMP/dn-class-tests"
          mkdir -p "$w/shims"
          python3 tools/gen-shim.py dn/compat/shims/shims.map "$w/shims" tv/src
          # a test program: built in a directory of units of its own (the builds run at once), then run
          t() {
            mkdir -p "$w/$1" && cd dn/tests &&
            fpc -Mdelphi -Sh- -Rintel -Se300 -dDPMI32 -dLINUX \
              -Fu../compat/linux -Fu../compat -Fu../archives -Fu../src \
              -Fu"$w/shims" -Fu../../tv/src \
              -Fi. -Fi../compat/shims -Fi../src \
              -FU"$w/$1" -FE"$w/$1" "$1.pas" &&
            "$w/$1/$1"
          }
          export -f t; export w
          CMDS="tv/tools/class-gate.sh
          python3 -B -m unittest discover -s tools/tests -p 'test_*.py'
          t t_objutil
          t t_profile
          t t_cfgstate" tools/ci-par.sh
      - name: tv3 gate after compilation
        run: tv/tools/class-gate.sh
