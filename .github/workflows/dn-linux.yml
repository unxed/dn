name: dn-linux
# DN on Linux, built by tools/build.sh from the tree dn/src: x86_64 (native FPC) and i386 (static, the cross compiler built from
# the sources of FPC and cached); then the tour and the file operations in a pty (tools/dn-linux-tour.py, tools/dn-linux-ops.py).
on:
  workflow_dispatch:
  push:
    paths:
      - dn/**
      - tv/**
      - tools/build.sh
      - tools/dn-env.sh
      - tools/dn-linux-*.py
      - tools/gen-archive-fixtures.py
      - tools/pty_screen.py
      - tools/build-fpc-i386-linux.sh
      - tools/build-fpc-aarch64-linux.sh
      - tools/gen-shim.py
      - .github/workflows/dn-linux.yml
  pull_request:

jobs:
  linux64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc python3
      - name: Build DN (one command, DN_UTF8=0 is the old one with the code page inside)
        run: DN_UTF8=0 tools/build.sh linux64 out/dn
      - name: Tour in a pty
        run: |
          python3 tools/dn-linux-tour.py out/dn | tee tour.txt
          ! grep -v ' ok$' tour.txt
      - name: File operations in a pty
        run: python3 tools/dn-linux-ops.py out/dn
      - name: The win32 input mode (keys as ESC [ Vk;Sc;Uc;Kd;Cs;Rc _) in a pty
        run: python3 tools/dn-linux-win32.py out/dn
      - name: The code page by the locale
        run: python3 tools/dn-linux-locale.py out/dn
      - uses: actions/upload-artifact@v4
        with:
          name: dn-linux-x86_64
          path: |
            out/dn/dn
            out/dn/*.LNG
            out/dn/*.DLG
            out/dn/*.HLP

  linux64-utf8:
    # DN with UTF-8 inside (the default of the build on Linux, -dDNUTF8): the same file operations in a pty and the UTF-8 checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc python3 p7zip-full
      - name: Build DN (one command; UTF-8 inside is the default)
        run: tools/build.sh linux64 out/dn
      - name: File operations in a pty (and the UTF-8 checks)
        run: DN_OPS_UTF8=1 python3 tools/dn-linux-ops.py out/dn
      - name: Archive enter/leave matrix (zip, 7z, tar, tgz, tar.gz)
        run: python3 tools/dn-linux-archives.py out/dn

  linux-aarch64:
    # DN on ARM64 Linux: a native build on an ARM runner (the compiler of the system), the same checks as for x86_64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc python3
      - name: Build DN (one command, native)
        run: tools/build.sh linux64 out/dn
      - name: Tour in a pty
        run: |
          python3 tools/dn-linux-tour.py out/dn | tee tour.txt
          ! grep -v ' ok$' tour.txt
      - name: File operations in a pty and the UTF-8 checks
        run: DN_OPS_UTF8=1 python3 tools/dn-linux-ops.py out/dn

  linux32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc make git binutils python3
      - name: Cross compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-i386-linux
          key: fpc-i386-linux-${{ hashFiles('tools/build-fpc-i386-linux.sh') }}
      - name: Build the cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-i386-linux.sh ~/fpc-i386-linux
      - name: Build DN (one command)
        run: DN_LINUX=~/fpc-i386-linux tools/build.sh linux out/dn
      - name: Tour in a pty
        run: |
          python3 tools/dn-linux-tour.py out/dn | tee tour.txt
          ! grep -v ' ok$' tour.txt
      - name: File operations in a pty and the UTF-8 checks (the locale test is for DN_UTF8=0 only)
        run: DN_OPS_UTF8=1 python3 tools/dn-linux-ops.py out/dn
      - uses: actions/upload-artifact@v4
        with:
          name: dn-linux-i386
          path: |
            out/dn/dn
            out/dn/*.LNG
            out/dn/*.DLG
            out/dn/*.HLP
