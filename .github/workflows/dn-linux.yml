name: dn-linux
# DN on Linux, built by tools/build.sh from the tree dn/src: x86_64 (native FPC), i386 (static, the cross compiler built from
# the sources of FPC and cached) and aarch64. The build takes seconds; the time goes into the pty tests (they wait for the program),
# so every group of tests is a job of its own, the jobs run side by side, and the tests of a group run side by side too (tools/ci-par.sh):
# the wall time is the time of the slowest test.
on:
  workflow_dispatch:
  push:
    paths:
      - dn/**
      - tv
      - tv/**
      - tve
      - tve/**
      - tools/build.sh
      - tools/dn-env.sh
      - tools/dn-linux-*.py
      - tools/gen-archive-fixtures.py
      - tools/pty_screen.py
      - tools/ci-par.sh
      - tools/build-fpc-i386-linux.sh
      - tools/build-fpc-aarch64-linux.sh
      - tools/gen-shim.py
      - .github/workflows/dn-linux.yml
  pull_request:

# One linux matrix per ref — newer pushes cancel older runs (runner budget).
concurrency:
  group: dn-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux64:
    # DN with the code page inside (DN_UTF8=0)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tour in a pty
            cmds: |
              python3 tools/dn-linux-tour.py out/dn | tee tour.txt && ! grep -v ' ok$' tour.txt
          - name: File operations and the win32 input mode
            cmds: |
              python3 tools/dn-linux-ops.py out/dn
              python3 tools/dn-linux-win32.py out/dn
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: Build DN (one command)
        run: DN_UTF8=0 tools/build.sh linux64 out/dn
      - name: ${{ matrix.name }}
        env:
          CMDS: ${{ matrix.cmds }}
        run: tools/ci-par.sh

  linux64-utf8:
    # DN with UTF-8 inside (the default of the build on Linux, -dDNUTF8): file operations in a pty and the UTF-8 checks, in groups that run side by side
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ops
            cmds: |
              DN_OPS_UTF8=1 python3 tools/dn-linux-ops.py out/dn
          - name: fsattrs
            cmds: |
              python3 tools/dn-linux-fsattrs.py out/dn
          - name: archives
            cmds: |
              python3 tools/dn-linux-archives.py out/dn
              python3 tools/dn-linux-arcmembers.py out/dn
          - name: desktop, config, crash
            cmds: |
              python3 tools/dn-linux-desktop.py out/dn
              python3 tools/dn-linux-config.py out/dn
              python3 tools/dn-linux-crash.py out/dn
          - name: names, setup, clipboard, locales
            cmds: |
              python3 tools/dn-linux-names.py out/dn
              python3 tools/dn-linux-setup.py out/dn
              python3 tools/dn-linux-clip.py out/dn
              python3 tools/dn-linux-far2l.py out/dn
              python3 tools/dn-linux-locale-utf8.py out/dn
          - name: panel, find, terminal
            cmds: |
              python3 tools/dn-linux-sortmark.py out/dn
              python3 tools/dn-linux-qsearch.py out/dn
              python3 tools/dn-linux-places.py out/dn
              python3 tools/dn-linux-find.py out/dn
              python3 tools/dn-linux-resize.py out/dn
              python3 tools/dn-linux-dlgresize.py out/dn
              python3 tools/dn-linux-embterm.py out/dn
              python3 tools/dn-linux-kitty.py out/dn
          - name: stage 10 dialogs
            cmds: |
              python3 tools/dn-linux-scrollchars.py out/dn
              python3 tools/dn-linux-colors.py out/dn
              python3 tools/dn-linux-arcsetup.py out/dn
              python3 tools/dn-linux-envedit.py out/dn
              python3 tools/dn-linux-emptyhist.py out/dn
              python3 tools/dn-linux-dialogok.py out/dn
              python3 tools/dn-linux-cyrsearch.py out/dn
              python3 tools/dn-linux-msgbox.py out/dn
              python3 tools/dn-linux-footer.py out/dn
              python3 tools/dn-linux-args.py out/dn
              python3 tools/dn-linux-ux.py out/dn
              python3 tools/dn-linux-pathscan.py out/dn
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3 p7zip-full xz-utils zip unzip
      - name: Build DN (one command)
        run: tools/build.sh linux64 out/dn
      - name: ${{ matrix.name }}
        env:
          CMDS: ${{ matrix.cmds }}
        run: tools/ci-par.sh

  menusweep:
    # every item of the main menu, the submenus included, each from a fresh start: no fatal error and no path of DOS form; one job per language and half
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: menusweep ENGLISH part 1 of 2
            cmds: |
              python3 tools/dn-linux-menusweep.py out/dn ENGLISH -j 8 --part 1/2
          - name: menusweep ENGLISH part 2 of 2
            cmds: |
              python3 tools/dn-linux-menusweep.py out/dn ENGLISH -j 8 --part 2/2
          - name: menusweep RUSSIAN part 1 of 2
            cmds: |
              python3 tools/dn-linux-menusweep.py out/dn RUSSIAN -j 8 --part 1/2
          - name: menusweep RUSSIAN part 2 of 2
            cmds: |
              python3 tools/dn-linux-menusweep.py out/dn RUSSIAN -j 8 --part 2/2
          - name: menusweep UKRAIN part 1 of 2
            cmds: |
              python3 tools/dn-linux-menusweep.py out/dn UKRAIN -j 8 --part 1/2
          - name: menusweep UKRAIN part 2 of 2
            cmds: |
              python3 tools/dn-linux-menusweep.py out/dn UKRAIN -j 8 --part 2/2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: Build DN (one command)
        run: tools/build.sh linux64 out/dn
      - name: ${{ matrix.name }}
        env:
          CMDS: ${{ matrix.cmds }}
        run: tools/ci-par.sh

  hotkeys:
    # the hot letters of the menus and of the dialogs on a Cyrillic layout (Alt and a Russian or Ukrainian letter)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: menus
            cmds: |
              python3 tools/dn-linux-hotkeys.py out/dn -j 8
          - name: dialogs
            cmds: |
              python3 tools/dn-linux-dialoghot.py out/dn -j 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: Build DN (one command)
        run: tools/build.sh linux64 out/dn
      - name: ${{ matrix.name }}
        env:
          CMDS: ${{ matrix.cmds }}
        run: tools/ci-par.sh

  linux-aarch64:
    # DN on ARM64 Linux: a native build on an ARM runner (the compiler of the system), the same checks as for x86_64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tour in a pty
            cmds: |
              python3 tools/dn-linux-tour.py out/dn | tee tour.txt && ! grep -v ' ok$' tour.txt
          - name: File operations in a pty and the UTF-8 checks
            cmds: |
              DN_OPS_UTF8=1 python3 tools/dn-linux-ops.py out/dn
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: Build DN (one command, native)
        run: tools/build.sh linux64 out/dn
      - name: ${{ matrix.name }}
        env:
          CMDS: ${{ matrix.cmds }}
        run: tools/ci-par.sh

  linux32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tour in a pty
            cmds: |
              python3 tools/dn-linux-tour.py out/dn | tee tour.txt && ! grep -v ' ok$' tour.txt
          - name: File operations in a pty and the UTF-8 checks
            cmds: |
              DN_OPS_UTF8=1 python3 tools/dn-linux-ops.py out/dn
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3 make git binutils
      - name: Cross compiler cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-i386-linux
          key: fpc-i386-linux-${{ hashFiles('tools/build-fpc-i386-linux.sh') }}
      - name: Build the cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-fpc-i386-linux.sh ~/fpc-i386-linux
      - name: Build DN (one command)
        run: DN_LINUX=~/fpc-i386-linux tools/build.sh linux out/dn
      - name: ${{ matrix.name }}
        env:
          CMDS: ${{ matrix.cmds }}
        run: tools/ci-par.sh
