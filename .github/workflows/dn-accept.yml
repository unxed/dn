name: dn-accept
# Acceptance by the full UI click-through: the UTF-8 build of DN and the build with the code page inside (DN_UTF8=0, the way DOS is
# built) must give the same cells in every scenario of tools/dn-linux-accept.py. Built once, then run in shards on GitHub runners, four
# parts of a shard side by side on each runner. (The object-vs-class gate of the class migration is closed: its object baseline was the
# old tv repository, whose units were removed from its history; docs/CLASS-MIGRATION-ACCEPTANCE-GATE.md.)
on:
  workflow_dispatch:

concurrency:
  group: dn-accept-${{ github.ref }}
  cancel-in-progress: true

env:
  DN_ACCEPT_FAST: '1'

jobs:
  # The same source in two builds: UTF-8 inside (the default) and the code page inside (DN_UTF8=0, the way DOS is built). Every scenario must give the same
  # cells in both (the screens differ only in the code page of the machine: it is one: the cells hold the characters). The area u8cp is run too.
  build-u8cp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: Build UTF-8 DN and DN with the code page inside, side by side (each with a TMPDIR of its own)
        env:
          CMDS: |
            TMPDIR=$(mktemp -d) tools/build.sh linux64 out/u8
            TMPDIR=$(mktemp -d) DN_UTF8=0 tools/build.sh linux64 out/cp
        run: tools/ci-par.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dn-u8cp-bins
          path: |
            out/u8/dn
            out/u8/*.lng
            out/u8/*.dlg
            out/u8/*.hlp
            out/u8/xlt/**
            out/cp/dn
            out/cp/*.lng
            out/cp/*.dlg
            out/cp/*.hlp
            out/cp/xlt/**
          if-no-files-found: error

  u8cp:
    needs: build-u8cp
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: dn-u8cp-bins
          path: bins
      - name: Layout bins
        run: |
          # the artifact keeps the directories below the common root of the paths (here out/): find them instead of guessing
          mkdir -p out
          for v in u8 cp; do
            src=$(find bins -type d -name $v | head -1)
            test -n "$src" || { echo "no $v in the artifact"; find bins | head -30; exit 1; }
            cp -a "$src" out/$v
          done
          chmod +x out/u8/dn out/cp/dn
          ls -la out/u8 out/cp | head -30
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3
      - name: UTF-8 build against the code page build, shard ${{ matrix.shard }}/6 (in four parts side by side, --shard I/24)
        run: |
          s=${{ matrix.shard }}
          export CMDS=$(for k in 0 1 2 3; do
            echo "DN_ACCEPT_U8CP=1 DN_ACCEPT_FAST=1 python3 tools/dn-linux-accept.py out/u8 out/cp --shard $((s + 6 * k))/24 > u8cp-shard-$s-$k.log"
          done)
          rc=0; tools/ci-par.sh || rc=1
          cat u8cp-shard-$s-*.log
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u8cp-shard-${{ matrix.shard }}
          path: u8cp-shard-${{ matrix.shard }}-*.log

  summarize:
    needs: u8cp
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: u8cp-shard-*
          merge-multiple: true
          path: logs
      - name: Merge shard summaries
        run: |
          set -e
          shopt -s nullglob
          pass=0; fail=0
          echo "## Shard logs" > summary.md
          logs=(logs/u8cp-shard-*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "NO SHARD LOGS" | tee -a summary.md
            exit 1
          fi
          for f in "${logs[@]}"; do
            echo "### $(basename "$f")" >> summary.md
            if grep -q '^SUMMARY ' "$f"; then
              line=$(grep '^SUMMARY ' "$f" | tail -1)
              echo "$line" >> summary.md
              p=$(echo "$line" | sed -n 's/.*pass=\([0-9]*\).*/\1/p')
              q=$(echo "$line" | sed -n 's/.*fail=\([0-9]*\).*/\1/p')
              pass=$((pass+p)); fail=$((fail+q))
            else
              echo "MISSING SUMMARY" >> summary.md
              fail=$((fail+1))
            fi
            echo '```' >> summary.md
            { grep -E '^(FAIL|XFAIL) ' "$f" || true; } >> summary.md
            echo '```' >> summary.md
          done
          echo "TOTAL pass=$pass fail=$fail" | tee -a summary.md
          test "$fail" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accept-summary
          path: |
            summary.md
            logs/**
