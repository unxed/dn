
[Interface]

EscForOutputWindow=0
; When set to 0, pressing Esc in the file panel acts like Alt-F5 (DOS screen,
; User screen); when set to 1, like Ctrl-O (Output window)
; (default: 0)

SkipXLatMenu=0
; When set to 0, the viewer picks the code table (Shift-F6) from a handy
; menu; when set to 1, from the inconvenient file dialog that some long-time
; DN users are used to

UseEnterInViewer=2
; When set to 0, pressing Enter while viewing a file does nothing; when set
; to 1, Enter closes the viewer window; and 2 makes Enter switch between the
; text, hexadecimal and dump view modes

PreserveMenuPositions=0
; When enabled, the current positions in all menus are kept between runs

HistoryErrorBeep=1
; If enabled, pressing Del on a "frozen" item in an input history beeps.
; Otherwise Del on such an item is simply ignored

ReuseEditors=0
ReuseViewers=0
; When set to 1, instead of opening a second window for the same file, DN
; asks to activate the already existing window. When set to 2, the existing
; window is activated without asking. When set to 0, a new window is always
; opened.

ReflectCopyDirection=0
; When set to 1, the copy progress indicator grows from right to left when
; copying from the right panel to the left one (Anton Fedorov)

VertScrollBarChars=±þ²
HorizScrollBarChars=±þ²
; HorizScrollBarChars and VertScrollBarChars set the characters used to draw
; the scroll bars. They consist of 5 characters: the first and the last
; characters, the bar character, the thumb character and the empty-bar
; character. Written as a string of five characters.
; Defaults: "±þ²" for horizontal, "±þ²" for vertical.

SystemMenuChar=254
; sets the character used to display the first submenu of the main menu.
; The character is given by its number in the ASCII table

DriveSelectVCenter=0
; Shows the drive change window (Alt-F1, F2) in the center of the panel.
; (default: 0)

WinManagerSelectNext=1
; when selecting a window with Alt+0, the next window in order is chosen, not
; the current one
; default: 1

CutDriveInfo=1
; shorten the drive descriptions in the Alt+F1/F2 drive selection
; default: 1

MenuOnError=1
; If set, on an obviously wrong operation (for example, Ctrl-1 in the file
; manager when settings block 1 is already loaded) a menu with suitable
; operations to choose the right one is shown.
; If cleared, such wrong actions are silently ignored.
; default: 1

PanelDescrDrive=######Size#Description
PanelDescrArc=######Size#Size#Ratio
PanelDescrArvid=######Size#Description
PanelDescrFind=Path######Size#Path
PanelDescrTemp=Path######Size#Path

[Clock]

RightAlignClock=1

DaysOfWeek=(use language default)

; Sets the names of the days of the week shown in the clock area while Ctrl
; is held, other than the defaults for the current language. If the value is
; 14 or 21 characters long, a two- or three-letter day name is taken from it,
; respectively. The day names are listed without spaces, starting from Sunday,
; for example, SunMonTueWedThuFriSat. If the parameter has any other length,
; is empty or missing, the two-letter names defined in the resources of each
; language are used.

ShowDayOfWeek=1
; show the day of the week while Ctrl is held

ShowCentury=1
; show four digits of the year while Ctrl is held

ShowSeconds=1
; show seconds on the clock
; (default: 1)

BlinkSeparator=1
; enables/disables blinking of the clock separator when seconds are hidden
; (default: 1)


[SmartPad]

LineChar=196
; sets the character used as the separator line in SmartPad.
; The character is given by its number in the ASCII table. The default
; pseudo-graphic character (-) is inappropriate in some cases, since it
; cannot be recoded

InsertDate=1
; insert the date when SmartPad is opened
; default: 1


[Game]
EnableGame=1
; setting this parameter to 0 disables launching the built-in game


[Clipboard]
MaxClipboardSize=4096
; maximum accumulated size of the Clipboard.
; default: 4096

SaveClipboardOnExit=0
; whether to keep the Clipboard between runs,
; default: 0


[Kernel]
CtrlBreakKill=0

SmartWindowsBoxClose=0
; Defines how DN/2 reacts to an attempt to close the console window with the
; system close button or from the window system menu:
; 0 - does not react (standard behavior of a console program)
; 1 - reacts as if Alt-X was pressed or the program was exited via the menu
; 2 - same as 1, but no exit confirmation is shown
; 3 - reacts as if Ctrl-Break was pressed
; default: 0

StoreVideoMode=0
; 0 means never save the video mode chosen from the menu, 1 means save it as
; video mode 1, 2 means save it as video mode 2.

CopyLimit=8192
; sets the copy buffer limit in kilobytes. Value 0 means no limit.
; The default is 8192 (8 megabytes)

ShowKeyCode=0
; debug flag: shows the scan codes of keys
; 0: key codes are not shown
; 1: Scancode/Code pairs are shown in a separate window
; 2: the scan code is shown in the top right corner
; 3: 1 and 2 at the same time

AutoSave=1
; resave all parameters to DN.INI at startup
; default: 1

ForceDefaultArchiver=
; can be one of the supported archiver types (see the file archiving dialog)
; or an empty string. If set, the given archiver is always preselected by
; default in the archiving dialog

[Editor]
DefCodePageView=Dos

AutoBracketPairs=()[]{}<>
; sets any number of character pairs treated as brackets by the AutoBrackets
; function. (Note: this parameter has nothing to do with matching-bracket
; search.) The default value is ()[]{}<>

WinManagerPosToEdit=1
; when Alt+0 is pressed while in the editor, the cursor moves to the next
; editor window, not to any window
; Note: this flag takes priority over WinManagerSelectNext
; default: 1

FastSearchDeep=0
; when searching for begin/end pairs etc., it may fail if comments contain
; keywords (the pair count gets confused ...).
; To avoid an unbounded search through the file (a very long wait), it is
; suggested to set a maximum search depth (about 300 lines)
; default: 0 - unbounded search

DefCodePage=Dos
; the code page for new files. Possible values: Dos, Win,
; Koi, Auto
; default: Dos

FastBookmark=1
; show the bookmark quick-access bar at the bottom of the editor window
; default: 1

ShowBookmarks=1
; show bookmarks in the editor

AutoScopeDetect=0
; automatic detection of the replace search scope in the editor: if there is
; a selection, then Selected text, otherwise Global
; default: 1

DrawRShift=0
; switch between single and double frame drawing in the editor with the
; right Shift
; default: 1

UnlimitUnindent=0
; behavior when shifting a block left with Ctrl+K U (shift while all lines
; can be shifted, or always)
; default: 0

F6_DuplicatesLine=0
; When set to 0, F6 in the editor toggles whitespace optimization; when set
; to 1, it duplicates the current line

[FilePanels]

ExecWin32CUI=pec
ExecWin32GUI=start /n /f pe
; These variables set how Win32 applications are launched in OS/2.
; They have no effect under Win32.
;    Non-empty string values set the launch prefix for Win32 applications
; (GUI and console, respectively). The prefix is up to 30 characters long.
;    With empty values the system's own means are used.
;    To block launching Win32 applications, use these values:
;ExecWin32GUI=rem
;ExecWin32CUI=rem

;    Default values - launch through Odin:
;ExecWin32GUI=start /n /f pe
;ExecWin32CUI=pec

QuickRenameInDialog=0
; Value 1 means quick file renaming with Alt-F6 should be done in a separate
; dialog window. While the DN.INI parameter QuickRenameInDialog sets which
; quick renaming method is used by Alt-F6, Alt-Shift-F6 lets you use the
; other method

UpperCaseSorting=0
; sort file names converted to upper case (1) or lower case (0)
; (default: 0)

[NetInfo]

NoLevelsInfo=0
; do not show SFT/TTS Lev. in the network information
; default: 0
; Note - has no effect in the OS/2 and Win32 versions, kept for
; compatibility with DN OSP

[TaskList]

ShowExePaths=0
; defines whether to show the executables the process was started from with
; the full path (1) or just the file name (0)
; (default: 0)

KillAllowed=0
; when set to 1, it is possible to kill a process
; (default: 0)

FilteredList=1
; when set to 1, the task list shows only the processes that can be switched
; to (made active) and are not in the user exclusion list; when 0, all
; processes
; (default: 1)

UserTaskFilter=pmshell.exe#filebar.exe
; sets the names of the process executables to exclude from the task list.
; The names must be separated by the "#" character

[Language]
ShowLanguageMenu=1
; value 1 means that choosing the "Change language" menu command or pressing
; Alt-F12 shows a menu with the list of all available languages (the set of
; available languages is determined by searching for resource files in the DN
; directories and %DNDLG%). This is convenient if more than two languages are
; installed. Value 0 (the default) means that choosing this command or
; pressing Alt-F12 automatically cycles to the next available language after
; the current one

HelpLanguageOverride=
; if non-empty, it is taken as the name of the language of the help system.
; For example, with HelpLanguageOverride=english the file english.hlp is
; used. If this parameter is empty or missing, the help file for the current
; (active) language is used. If there is no help file for the active
; language, the help file for English is used

ActiveLanguage=
; if non-empty, it is taken as the name of the current language.
; For example, with ActiveLanguage=russian the resource files russian.* are
; used. If this parameter is empty or missing, the DNLNG environment
; variable is used. If that variable is not set either, English is used

[Calendar]

OptionFlags=8
;OptionFlags = long
;   Defines the main calendar settings. Takes a combination of the
;   following values:
;    8 - enables the indicator showing the week and day number;
;   16 - with SundayFirst = 1 the week number on the indicator will be
;        incompatible with the ISO 8601 international standard, but "correct"
;        from the point of view of the calendar itself, since the week number
;        stays the same during the whole week, from Sunday to Saturday.
;   (default: 8)

SundayFirst=2
;SundayFirst = long
;   With value 1 Sunday is the 1st day of the week. With value 0 it is the
;   last one. With value 2 the parameter is determined automatically.
;   (default: 2)

